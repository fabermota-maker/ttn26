<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nataleluia Preview</title>
    <meta
      name="description"
      content="Preview local da landing page Nataleluia no Cursor."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/preview.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="lp-preview-page">
    <div id="lp-boot" class="lp-boot" aria-busy="true" aria-live="polite" aria-label="Carregando Nataleluia">
      <div class="lp-boot-inner">
        <img class="lp-boot-logo" src="./assets/logo-nataleluia.png" width="280" height="140" alt="Nataleluia" />
        <div class="lp-boot-stars" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
            <style>
              .star-tw { animation: twnk 1.2s ease-in-out infinite alternate; transform-origin: center; }
              .st-1 { animation-delay: 0s; }
              .st-2 { animation-delay: 0.4s; }
              .st-3 { animation-delay: 0.8s; }
              @keyframes twnk {
                0% { transform: scale(0.3); opacity: 0.3; }
                100% { transform: scale(1.1); opacity: 1; }
              }
            </style>
            <g fill="#ffffff">
              <path d="M25 8 l1.5 4.5 4.5 1.5 -4.5 1.5 -1.5 4.5 -1.5 -4.5 -4.5 -1.5 4.5 -1.5 z" class="star-tw st-1" style="transform-origin: 25px 14px;"></path>
              <path d="M12 28 l1 3 3 1 -3 1 -1 3 -1 -3 -3 -1 3 -1 z" class="star-tw st-2" style="transform-origin: 12px 32px;"></path>
              <path d="M38 28 l1 3 3 1 -3 1 -1 3 -1 -3 -3 -1 3 -1 z" class="star-tw st-3" style="transform-origin: 38px 32px;"></path>
            </g>
          </svg>
        </div>
      </div>
    </div>
    <div id="root"></div>

    <script src="./js/lp-boot.js"></script>
    <script src="./js/preview-loader.js"></script>
  </body>
</html>
